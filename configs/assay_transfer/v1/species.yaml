version: species_v1
status: implemented_partial_integration

output_columns:
  species_exact:
    description: >-
      Exact normalized species explicitly present in an approved source field;
      null when absent, generic, or ambiguous.
    nullable: true

usage_contract:
  condition_key_and_label_construction_only: true
  replace_raw_source_field: false
  model_facing_retrieval_metadata_uses_raw_source_field: true
  query_metadata_available_at_inference: false

source_fields:
  oral_bioavailability:
    explicit_species_column: species_or_population
    explicit_text_columns: []
    excluded_text_columns: [support_text, extra_details]
  q1:
    explicit_species_column: null
    explicit_text_columns: [study_context]
    excluded_text_columns: [support_text, extra_details]
  q2:
    explicit_species_column: null
    explicit_text_columns: [biological_context, assay_system]
    excluded_text_columns: [support_text, extra_details]
  q3:
    explicit_species_column: null
    explicit_text_columns: [intestinal_site, assay_system]
    excluded_text_columns: [support_text, extra_details]
  q4:
    explicit_species_column: species
    explicit_text_columns: [assay_system]
    excluded_text_columns: [support_text, extra_details]

