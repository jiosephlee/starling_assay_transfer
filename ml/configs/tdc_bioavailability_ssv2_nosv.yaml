# Record-KNN eval of the small (<10M) no-source-value, same-species-v2 baseline on
# TDC Bioavailability_Ma. TDC rows carry no metadata, so every metadata field is missing
# (present=0) and the model uses its learned per-field missing_emb. use_source_value=false
# means the scorer never requires the (absent) source scalar.
#
# Architecture mirrors the small_lt10m_v1 preset (run_shared_eval_benchmark.py) so
# build_model matches the checkpoint shapes.
paths:
  dataset: tdc_Bioavailability_Ma
  base_parquet: datasets/base/tdc_Bioavailability_Ma/base.parquet
  splits_dir: datasets/pairs_split_full/tdc_Bioavailability_Ma_unused
  embeddings_dir: ml/artifacts/embeddings_tdc_Bioavailability_Ma
  memmap_dir: ml/artifacts/memmap_tdc_Bioavailability_Ma
  output_dir: ml/artifacts/runs/tdc_Bioavailability_Ma

embedding:
  metadata_fields:
    - molecule_name
    - species_or_population
    - dose
    - oral_exposure_mode
    - qualifying_conditions
    - comparator
    - extra_details

model:
  use_source_value: false
  mol_hidden: 384
  mol_out: 256
  meta_field_proj: 32
  d_model: 384
  d_ff: 1024
  n_blocks: 6

train:
  record_knn_eval_dataset_dir: datasets/starling_eval/tdc_Bioavailability_Ma_record_splits_hf
  record_knn_eval_dataset_config: full_metadata
  record_knn_eval_cache_dir: ml/artifacts/record_knn_eval_cache/tdc_Bioavailability_Ma
  record_knn_eval_splits:
    - validation_1
  record_knn_eval_top_fraction: 0.10
  record_knn_eval_k: 10
  record_knn_eval_batch_size: 4096
